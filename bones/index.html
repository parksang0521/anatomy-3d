<!-- 자동 업데이트: 배포 시각(Last-Modified)이 바뀌면 새 버전으로 갱신 -->
<style>#updBar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;background:#0f1a2e;border:1px solid rgba(94,234,255,.45);color:#e2e8f0;border-radius:22px;padding:7px 8px 7px 16px;font:13px/1.3 system-ui,-apple-system,sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}#updBar button{background:#5eeaff;color:#04121a;border:0;border-radius:16px;padding:6px 12px;font-weight:700;font-size:12.5px}#updBar .x{background:none;color:#94a3b8;padding:4px 6px}</style>
<script>
(function(){
  var here=Date.parse(document.lastModified)||0;
  window.__DEPLOY=here||Date.now();
  window.__vurl=function(u){ return u+(u.indexOf('?')<0?'?':'&')+'d='+window.__DEPLOY; };
  var busy=false, hiddenAt=0, shown=false;
  function go(lm){
    try{ var k='updTry'+lm; if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
    var u=new URL(location.href); u.searchParams.set('v',lm); location.replace(u.toString());
  }
  function bar(lm){
    if(shown) return; shown=true;
    var b=document.createElement('div'); b.id='updBar';
    b.innerHTML='새 버전이 있어요<button>업데이트</button><button class="x" aria-label="닫기">✕</button>';
    b.children[0].onclick=function(){ go(lm); };
    b.children[1].onclick=function(){ b.remove(); };
    document.body.appendChild(b);
  }
  function check(auto){
    if(busy||!here) return; busy=true;
    fetch(location.pathname,{cache:'no-store'}).then(function(r){
      var lm=Date.parse(r.headers.get('last-modified')||'');
      if(lm&&lm>here+1000){ if(auto) go(lm); else bar(lm); }
    }).catch(function(){}).then(function(){ busy=false; });
  }
  check(true);                                   // 앱을 열 때: 새 버전이면 바로 갱신
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ hiddenAt=Date.now(); return; }
    check(hiddenAt && Date.now()-hiddenAt>10*60*1000); // 오래 쉬었다 돌아오면 자동, 아니면 안내
  });
  setInterval(function(){ if(!document.hidden) check(false); },30*60*1000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree=computeBoundsTree; THREE.Mesh.prototype.raycast=acceleratedRaycast;

const D = await (await fetch(__vurl('data.json'))).json();
const ITEMS=D.items, LM=D.lm, MS=D.meshes, TYPES=D.types, OV=D.ov, NAV=D.nav;
const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const ovById=Object.fromEntries(OV.map(o=>[o.id,o]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enS=l=>l.e.replace(/\s*\(.*?\)/g,'').split(' / ')[0].trim();
const koS=l=>l.n.replace(/\s*\(.*?\)\s*/g,'').trim();
const TYPES_EN={f:'Foramen · canal',p:'Process · eminence',s:'Surface · fossa · groove',l:'Line · border',j:'Articular surface',x:'Landmark point',b:'Part'};
const itemKo=it=>it.ko.split('  ·  ')[0];

/* ---------- three ---------- */
const cv=$('#cv'), main=$('#main');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true}); ren.setPixelRatio(Math.min(devicePixelRatio,1.75)); ren.localClippingEnabled=true;
ren.setClearColor(0x0b0f1a);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,1,12000); cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,cv); ctl.enableDamping=true; ctl.dampingFactor=.12; ctl.rotateSpeed=.8;
scene.add(new THREE.HemisphereLight(0xffffff,0x3a3020,1.1));
const key=new THREE.DirectionalLight(0xffffff,1.5); scene.add(key); scene.add(key.target);
const fill=new THREE.DirectionalLight(0xbcd4ff,.5); scene.add(fill);
const root=new THREE.Group(); scene.add(root);
const ovRoot=new THREE.Group(); scene.add(ovRoot);
const pinG=new THREE.Group(); scene.add(pinG);
let dirty=true;
function resize(){const r=main.getBoundingClientRect(); ren.setSize(r.width,r.height,false); cam.aspect=r.width/Math.max(1,r.height); cam.updateProjectionMatrix(); dirty=true;}
addEventListener('resize',resize);
const clipPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),1e5);
const PALETTE=[0xe9dfc8,0xdccfae,0xe8d6b9,0xd9cdb8,0xefe3cc,0xd4c6a6,0xe3d2c0,0xcfc4ad];
function boneMat(col){return new THREE.MeshStandardMaterial({color:col,roughness:.72,metalness:0,clippingPlanes:[clipPlane],side:THREE.DoubleSide});}
async function gunzip(url){const r=await fetch(__vurl(url)); return await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}
function mkGeo(ab,vo,vc,io,ic,lo,sc,i32){
  const q=new Uint16Array(ab,vo,vc*3), pos=new Float32Array(vc*3);
  for(let i=0;i<vc;i++){pos[i*3]=lo[0]+q[i*3]*sc[0];pos[i*3+1]=lo[1]+q[i*3+1]*sc[1];pos[i*3+2]=lo[2]+q[i*3+2]*sc[2];}
  const idx=i32?new Uint32Array(ab.slice(io,io+ic*4)):new Uint16Array(ab.slice(io,io+ic*2));
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeVertexNormals(); g.computeBoundingBox(); g.computeBoundingSphere(); g.computeBoundsTree(); return g;
}
const geoCache={};
async function geom(id){ if(geoCache[id]) return geoCache[id]; const c=MS[id]; const ab=await gunzip('m/'+id+'.bin.gz');
  return geoCache[id]=mkGeo(ab,0,c.vc,c.vc*6,c.ic,c.lo,c.sc,c.i32); }

/* ---------- state ---------- */
const S={mode:'overview',item:null,side:'R',sel:null,selPin:null,labels:'on',typeF:'all',tab:'lm',quiz:null,preset:null,colorBones:false,ovSel:null,open:{}};
let meshes=[], pins=[], box=new THREE.Box3(), center=new THREE.Vector3(), radius=100, ovMeshes=[], ovLoaded=false;
const raycaster=new THREE.Raycaster();
function variant(){const it=S.item; return it.var[S.side]||it.var['']||Object.values(it.var)[0];}

/* ---------- 전신 뼈대 ---------- */
async function loadOverviewMeshes(){

/* ---------- 사이드바 ---------- */
/* 검색: 띄어쓰기·순서 무관, 옛 용어, 초성(ㄴㄷㄹ), 영문 오타 허용 */
const CHO_='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choOf_=t=>[...t].map(c=>{const k=c.charCodeAt(0)-0xAC00; return k>=0&&k<11172?CHO_[Math.floor(k/588)]:c;}).join('');
const nrm_=t=>(t||'').toLowerCase().replace(/왼쪽|좌측/g,'왼').replace(/오른쪽|우측/g,'오른').replace(/[\s·\-,()'’]/g,'');
function lev_(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let pr=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,pr+(a[i-1]===b[j-1]?0:1)); pr=t; } } return d[b.length]; }
function mkIdx_(ko,old,en,extra){ const k=nrm_(ko)+'|'+nrm_(old)+'|'+nrm_(extra||''); const e=(en||'').toLowerCase(); return {k, cho:choOf_(nrm_(ko)+'|'+nrm_(old)), e, ew:e.split(/[^a-z0-9]+/).filter(Boolean)}; }
function mscore_(ix,q,fuzzy){
  const toks=q.trim().split(/\s+/).filter(Boolean); if(!toks.length) return 0; let sc=0;
  for(const t0 of toks){ let v=0;
    if(/[가-힣ㄱ-ㅎ]/.test(t0)){ const t=nrm_(t0);
      if(/^[ㄱ-ㅎ]+$/.test(t)) v=ix.cho.split('|').some(c=>c.startsWith(t))?30:ix.cho.includes(t)?14:0;
      else { const fs=ix.k.split('|'); v=fs.some(f=>f===t)?100:fs.some(f=>f.startsWith(t))?45:ix.k.includes(t)?22:0; } }
    else { const t=t0.toLowerCase();
      v=ix.e===t?100:ix.ew.includes(t)?40:ix.ew.some(w=>w.startsWith(t))?26:ix.e.includes(t)?14:0;
      if(!v&&fuzzy&&t.length>=4){ const lim=t.length>=7?2:1; if(ix.ew.some(w=>lev_(w,t)<=lim||(w.length>t.length&&lev_(w.slice(0,t.length),t)<=lim))) v=9; } }

let IIX_=null, LIX_=null;

function searchBoth_(q){
  IIX_ ||= ITEMS.map(it=>[it,mkIdx_(it.ko,'',it.en,it.id+' '+itemKo(it))]);
  LIX_ ||= Object.entries(LM).map(([k,l])=>[k,mkIdx_(l.n,l.o,l.e,'')]);
  const run=f=>[IIX_.map(([it,ix])=>[mscore_(ix,q,f)-it.en.length*0.05,it]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]),

}

  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

function startQuiz(st){
  const fromOv=S.mode!=='bone';
  S.quiz={mode:st.mode,scope:st.scope,input:st.input||'choice',ok:0,n:0,fromOv,back:S.mode==='bone'?{id:S.item.id,side:S.side}:null};
  hideInfo(); nextQuiz().then(()=>renderQuiz());
}
function stopQuiz(){ const q=S.quiz; S.quiz=null; S._qs=null;
  if(q&&!q.setup){ if(q.fromOv){ $('#panel').classList.remove('open'); S.tab='lm'; enterOverview(); return; }
    if(q.back && (q.back.id!==S.item.id||q.back.side!==S.side)) loadItem(q.back.id,q.back.side); }
  endQuizState(q||{}); renderPanel(); }
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function nextQuiz(){
  const q=S.quiz; if(!q||q.setup||q.busy) return; q.done=false; q.fb=''; q.fbc=''; q.pick=null; q.typed='';
  if(q.scope!=='cur'||q.mode==='lr'){
    const pool=scopeItems(q); if(!pool.length){ q.target=null; drawQ(); return; }
    const it=pick(pool); const sd=it.var.R?(Math.random()<.5?'R':'L'):null;
    q.busy=true; await loadItem(it.id,sd,q.mode!=='lr'?false:true); q.busy=false; S.quiz=q;
  }
  if(q.mode==='lr'){
    q.answer=S.side; q.itemId=S.item.id;
    const dirs=[[0,-1,0],[0,1,0],[1,0,0],[-1,0,0],[0.6,-0.8,0],[-0.6,-0.8,0],[0.5,0.7,0.5],[0,0,1]];
    const d=new THREE.Vector3(...pick(dirs)).normalize(); cam.up.set(0,0,1);
    const dist=radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*1.1; anim=null; ctl.target.copy(center); cam.position.copy(center).addScaledVector(d,dist); ctl.update();
    renderTop(); drawQ(); dirty=true; return;
  }
  let ks=uniqKeys().filter(k=>!k.startsWith('vname_')&&pins.some(p=>p.k===k&&!p.filtered&&!p.hiddenByPreset));
  if(q.mode==='pass') ks=ks.filter(k=>LM[k].t==='f'&&LM[k].pas);
  if(ks.length<2){ q.target=null; drawQ(); return; }
  let t=pick(ks); if(ks.length>1) while(t===q.target) t=pick(ks);
  q.target=t; S.sel=null;
  pins.forEach(p=>{const on=p.k===t&&q.mode==='blank'; p.mesh.material.color.set(on?0xa78bfa:(p.t==='f'?0x38bdf8:0xf87171)); p.mesh.scale.setScalar(pinR()*(on?1.8:1)); p.mesh.material.depthTest=!on; p.mesh.renderOrder=on?5:0;});
  const pool=(q.mode==='pass'?ks:uniqKeys().filter(k=>!k.startsWith('vname_'))).filter(k=>k!==t);
  const same=pool.filter(k=>LM[k].t===LM[t].t); const extra=Object.keys(LM).filter(k=>k!==t&&LM[k].t===LM[t].t&&!k.startsWith('vname_'));
  let opts=shuffle(same.length>=3?same:pool).slice(0,3); while(opts.length<3){ const x=pick(extra); if(!opts.includes(x)) opts.push(x); }
  q.opts=shuffle([t,...opts]);
  if(q.mode==='blank'){ const ps=pins.filter(p=>p.k===t); const p=ps.find(p=>!p.occ)||ps[0]; S.selPin=p.i; flyTo(p.pos,true); }
  hideInfo(); renderTop(); drawQ(); occDirty=true; dirty=true;
}
function finishQ(ok,msg){ const q=S.quiz; q.n++; if(ok) q.ok++; q.done=true; q.fbc=ok?'ok':'no'; q.fb=msg;
  selectKey(q.target,null,q.mode!=='blank'); renderQuiz(); }
function drawQ(){
  const q=S.quiz; const el=$('#qbody'); if(!q||!el) return;
  const next=q.done?'<button class="big" id="qn">다음 문제 →</button>':'';
  if(q.mode==='lr'){ const it=byId[q.itemId]; if(!it){el.innerHTML='';return;}
    el.innerHTML=`<div class="qq">이 ${esc(it.en)}는 왼쪽? 오른쪽?</div><div class="muted">${esc(itemKo(it))} — 돌려 보면서 판단해 보세요.</div>
    <div class="lr2"><button data-a="L">왼쪽 Left</button><button data-a="R">오른쪽 Right</button></div><div class="fb ${q.fbc||''}">${q.fb||''}</div>${next}`;
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ if(q.done) return; q.n++; const ok=b.dataset.a===q.answer; if(ok) q.ok++; q.done=true;
      q.fbc=ok?'ok':'no'; q.fb=(ok?'정답! ':'오답 — ')+`${q.answer==='R'?'Right · 오른쪽':'Left · 왼쪽'} ${esc(it.en)}입니다.<div class="muted" style="margin-top:6px">${esc(it.info.lr)}</div>`;
      renderTop(); renderQuiz(); });
    if(q.done) $('#qn').onclick=()=>nextQuiz().then(renderQuiz);
    return; }
  if(!q.target){ el.innerHTML='<div class="muted">이 범위에서는 낼 문제가 부족해요. "유형 바꾸기"에서 범위를 넓혀 보세요.</div>'; return; }
  const L=LM[q.target];
  const ans=q.done?`<div class="card" style="margin-top:8px"><b>${esc(L.e)}</b><span class="ko">${esc(L.n)}${L.o?' · '+esc(L.o):''}</span>${L.pas&&q.mode!=='pass'?`<div class="muted" style="margin-top:4px">통과: ${esc(L.pas)}</div>`:''}</div>`:'';
  if(q.mode==='blank'){
    let h=`<div class="qq">보라색 빈칸(?)에 들어갈 이름은?</div><div class="muted">주변 이름표를 힌트 삼아 맞혀 보세요.</div>`;
    if(q.input==='type'){
      h+=`<div style="display:flex;gap:6px;margin-top:8px"><input id="qin" autocomplete="off" placeholder="영문 또는 한글로 입력" value="${esc(q.typed||'')}" ${q.done?'disabled':''} style="flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit"><button class="ghost" id="qok" ${q.done?'disabled':''}>확인</button></div>`+
        (q.done?'':`<button class="ghost" id="qhint">보기 4개로 힌트</button><button class="ghost" id="qgive">모르겠음</button>`);
      if(q.hint&&!q.done) h+=q.opts.map(k=>`<div class="muted">· ${esc(enS(LM[k]))} / ${esc(koS(LM[k]))}</div>`).join('');
    } else h+=q.opts.map(k=>`<button class="qbtn" data-k="${k}">${optHTML(k)}</button>`).join('');
    el.innerHTML=h+`<div class="fb ${q.fbc||''}">${q.fb||''}</div>${ans}${next}`;
    const inp=$('#qin');
    if(inp){ if(!q.done) setTimeout(()=>inp.focus(),50);
      const sub=()=>{ if(q.done) return; q.typed=inp.value; const ok=checkTyped(q.target,inp.value); finishQ(ok, ok?'정답!':'오답 — 정답은 아래에.'); };
      inp.onkeydown=e=>{ if(e.key==='Enter') sub(); }; $('#qok').onclick=sub;
      const hb=$('#qhint'); if(hb) hb.onclick=()=>{ q.typed=inp.value; q.hint=true; drawQ(); };
      const gv=$('#qgive'); if(gv) gv.onclick=()=>finishQ(false,'정답을 확인하세요.'); }
  }
  else if(q.mode==='pass') el.innerHTML=`<div class="qq">다음 구조물이 지나가는 구멍은?</div><div class="card" style="margin:6px 0">${esc(L.pas)}</div>`+q.opts.map(k=>`<button class="qbtn" data-k="${k}">${optHTML(k)}</button>`).join('')+`<div class="fb ${q.fbc||''}">${q.fb||''}</div>${ans}${next}`;
  else if(q.mode==='find'){ el.innerHTML=`<div class="qq">3D에서 이 위치를 찾아 누르세요</div><div style="font-size:16px;font-weight:700;margin:6px 0 0">${esc(L.e)}</div><div class="muted">${esc(L.n)}${L.o?' · '+esc(L.o):''}</div><div class="fb ${q.fbc||''}">${q.fb||''}</div>${q.done?next:'<button class="ghost" id="qskip" style="margin-top:8px">모르겠음 (정답 보기)</button>'}`;
    const sk=$('#qskip'); if(sk) sk.onclick=()=>finishQ(false,'정답 위치를 표시했습니다.'); }
  el.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{ if(q.done) return; q.pick=b.dataset.k; const ok=b.dataset.k===q.target; finishQ(ok,ok?'정답!':'오답'); });
  if(q.done) el.querySelectorAll('.qbtn').forEach(b=>{ if(b.dataset.k===q.target) b.classList.add('ok'); else if(b.dataset.k===q.pick) b.classList.add('no'); });
  const n=$('#qn'); if(n) n.onclick=()=>{ q.hint=false; nextQuiz().then(renderQuiz); };
}
function quizAnswerFind(i){
  const q=S.quiz; if(q.done) return; const ok=pins[i].k===q.target;
  finishQ(ok, ok?'정답!':`오답 — 누른 곳은 "${esc(enS(LM[pins[i].k]))}". 정답 위치를 표시했습니다.`);
}

/* ---------- 주소 ---------- */
function setHash(){ const h=S.mode==='overview'?'#skeleton':'#'+S.item.id+(S.item.var.R?'/'+S.side:'')+(S.sel?'/'+S.sel:''); if(location.hash!==h) history.replaceState(null,'',h); }
async function fromHash(){ const [id,a,b]=decodeURIComponent(location.hash.slice(1)).split('/'); if(byId[id]){ const side=(a==='R'||a==='L')?a:null; const k=side?b:a; await loadItem(id,side); if(k&&LM[k]) selectKey(k); return true;} return false; }

/* ---------- loop ---------- */
ctl.addEventListener('change',()=>{dirty=true;});
let idlePending=false;
function loop(now){ requestAnimationFrame(loop); stepAnim(now); ctl.update();
  key.position.copy(cam.position).add(cam.up.clone().multiplyScalar(radius*2)); key.target.position.copy(ctl.target);
  fill.position.copy(ctl.target).sub(cam.position.clone().sub(ctl.target)).add(new THREE.Vector3(0,0,-radius));
  if(dirty||anim){ ren.render(scene,cam); occDirty=true; updateLabels(now); dirty=false; idlePending=true; }
  else if(idlePending && now-lastOcc>150){ occDirty=true; updateLabels(now); idlePending=occDirty; } }
resize();
if(!(await fromHash())) await enterOverview();
requestAnimationFrame(loop);
addEventListener('hashchange',async()=>{ if(!(await fromHash())) enterOverview(); });
</script>
