<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>골학 3D — 뼈 랜드마크·구멍 학습</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0f1a">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--panel:rgba(16,21,34,.92);--line:rgba(148,163,184,.16);--text:#e7ebf3;--muted:#8e9ab0;--acc:#f5b94a;--acc2:#38bdf8;--ok:#34d399;--bad:#f87171;--bone:#e9dfc8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#app{display:flex;height:100vh;height:100dvh}
/* sidebar */
#side{width:268px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:6}
#side header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
#side h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
#side h1 b{color:var(--acc)}
#side .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
#side .sub a{color:var(--acc2);text-decoration:none}
#q{margin-top:10px;width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-size:13px;outline:none}
#q:focus{border-color:var(--acc)}
#list{flex:1;overflow:auto;padding:4px 0 20px}
.grp{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:12px 16px 4px}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 16px;font-size:13.5px;color:#d5dbe6;border-left:3px solid transparent}
.it:hover{background:rgba(255,255,255,.04)}
.it.on{border-left-color:var(--acc);background:rgba(245,185,74,.09);color:#fff}
.it small{color:var(--muted);font-size:11px;margin-left:auto}
.hit{display:block;width:100%;text-align:left;padding:5px 16px 5px 28px;font-size:12.5px;color:#cbd3df}
.hit:hover{background:rgba(255,255,255,.05)} .hit i{font-style:normal;color:var(--muted);font-size:11px}
/* main */
#main{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(8px,-50%);white-space:nowrap;font-size:11.5px;padding:1px 6px;border-radius:5px;background:rgba(10,14,24,.78);color:#f3f4f6;border:1px solid rgba(255,255,255,.12);pointer-events:auto;cursor:pointer;line-height:1.5}
.lb.f{border-color:rgba(56,189,248,.55);color:#bae6fd}
.lb.sel{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:700;z-index:3}
.lb.q{background:#7c3aed;color:#fff;border-color:#a78bfa}
#top{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:4}
#top>*{pointer-events:auto}
#ttl{font-size:18px;font-weight:700;text-shadow:0 1px 8px #000;margin-right:6px}
#ttl small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 10px;font-size:12.5px;color:#cfd6e2;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#1a1205;font-weight:700}
.seg button:hover:not(.on){background:rgba(255,255,255,.06)}
#menuBtn{display:none}
/* right panel */
#panel{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:11px 4px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:var(--acc)}
#pbody{flex:1;overflow:auto;padding:14px 16px 24px;font-size:13.5px;line-height:1.65}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:13px;color:var(--acc)}
.card p{margin:0}
.lmg{margin:10px 0 2px;font-size:11.5px;color:var(--muted);font-weight:700}
.lmi{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;padding:4px 6px;border-radius:7px;font-size:13px;color:#dbe1ea}
.lmi:hover{background:rgba(255,255,255,.05)} .lmi.on{background:rgba(245,185,74,.15);color:#fff}
.lmi i{font-style:normal;font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:#fca5a5;transform:translateY(-1px)}
.dot.f{background:var(--acc2)}
table.ft{width:100%;border-collapse:collapse;font-size:12.5px}
.ft td,.ft th{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top;text-align:left}
.ft th{color:var(--muted);font-weight:500;font-size:11.5px}
.ft tr{cursor:pointer} .ft tr:hover td{background:rgba(255,255,255,.04)}
.ft td:first-child{color:#bae6fd;white-space:nowrap;font-weight:500}
/* info card on viewport */
#info{position:absolute;left:12px;bottom:12px;width:min(420px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;z-index:4;display:none;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#info .x{position:absolute;right:8px;top:6px;font-size:18px;color:var(--muted);padding:4px 8px}
#info .nm{font-size:17px;font-weight:700;padding-right:26px}
#info .alt{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
#info .tp{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:rgba(255,255,255,.08);color:#cbd5e1;margin-left:6px;vertical-align:2px;font-weight:500}
#info .row{font-size:13px;line-height:1.6;margin-top:6px}
#info .row b{color:var(--acc);font-weight:500;margin-right:4px}
#info .row.pass b{color:var(--acc2)}
#info .row.c b{color:#f9a8d4}
#chip{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;display:none;z-index:4}
#chip button{color:var(--acc2);margin-left:8px}
#load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;z-index:3}
/* quiz */
.qbtn{display:block;width:100%;text-align:left;padding:9px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);font-size:13.5px}
.qbtn:hover{border-color:var(--acc)}
.qbtn.ok{border-color:var(--ok);background:rgba(52,211,153,.12)}
.qbtn.no{border-color:var(--bad);background:rgba(248,113,113,.12)}
.big{display:block;width:100%;padding:10px;border-radius:10px;background:var(--acc);color:#1a1205;font-weight:700;margin-top:10px}
.ghost{display:inline-block;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;margin:3px 4px 3px 0}
.ghost.on{border-color:var(--acc);color:var(--acc)}
.qq{font-size:15px;font-weight:700;margin:6px 0 4px}
.score{float:right;color:var(--muted);font-size:12px}
.fb{margin-top:8px;font-size:13px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.lr2{display:flex;gap:8px;margin-top:8px}.lr2 button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:15px;font-weight:700}
.lr2 button:hover{border-color:var(--acc)}
.muted{color:var(--muted);font-size:12px}
.note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6}
@media (max-width:900px){
  .seg button{padding:5px 7px;font-size:11.5px}
  #top{gap:5px;top:6px;left:6px;right:6px}
  .lb{font-size:10.5px}
  #panel{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);transform:translateX(100%);transition:.25s}
  #panel.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #side{position:absolute;left:0;top:0;bottom:0;width:min(280px,86vw);transform:translateX(-100%);transition:.25s}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #menuBtn,#panelBtn{display:inline-flex!important}
  #ttl{font-size:15px;width:100%;order:-1}
  #info{bottom:8px;left:8px;width:calc(100% - 16px);max-height:46vh;overflow:auto}
}
#panelBtn{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"}}</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>골학 <b>3D</b></h1>
      <div class="sub">뼈 하나씩 · 랜드마크 · 구멍과 통과 구조물 · <a href="../">← 전신 해부학 아틀라스</a></div>
      <input id="q" type="search" placeholder="검색: 큰결절, 대결절, foramen ovale…" autocomplete="off">
    </header>
    <div id="list"></div>
  </aside>
  <main id="main">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div id="top">
      <div class="seg" id="menuBtn"><button onclick="document.getElementById('side').classList.toggle('open')">☰ 뼈</button></div>
      <div id="ttl"></div>
      <div class="seg" id="sideSeg"></div>
      <div class="seg" id="viewSeg"></div>
      <div class="seg" id="presetSeg"></div>
      <div class="seg" id="labSeg"></div>
      <div class="seg" id="panelBtn"><button onclick="document.getElementById('panel').classList.toggle('open')">정보·퀴즈 ☰</button></div>
    </div>
    <div id="load">불러오는 중…</div>
    <div id="info"></div>
    <div id="chip"></div>
  </main>
  <aside id="panel">
    <div id="tabs"><button data-t="info" class="on">정보</button><button data-t="lm">랜드마크</button><button data-t="for">구멍표</button><button data-t="quiz">퀴즈</button></div>
    <div id="pbody"></div>
  </aside>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree=computeBoundsTree; THREE.Mesh.prototype.raycast=acceleratedRaycast;

const D = await (await fetch('data.json')).json();
const ITEMS = D.items, LM = D.lm, MS = D.meshes, TYPES = D.types;
const byId = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = n=>n.replace(/\s*\(.*?\)\s*/g,'').trim();

/* ---------- three ---------- */
const cv=$('#cv'), main=$('#main');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true}); ren.setPixelRatio(Math.min(devicePixelRatio,1.75)); ren.localClippingEnabled=true;
ren.setClearColor(0x0b0f1a);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,1,6000); cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,cv); ctl.enableDamping=true; ctl.dampingFactor=.12; ctl.rotateSpeed=.8;
scene.add(new THREE.HemisphereLight(0xffffff,0x3a3020,1.1));
const key=new THREE.DirectionalLight(0xffffff,1.5); scene.add(key); scene.add(key.target);
const fill=new THREE.DirectionalLight(0xbcd4ff,.5); scene.add(fill);
const root=new THREE.Group(); scene.add(root);
const pinG=new THREE.Group(); scene.add(pinG);
function resize(){const r=main.getBoundingClientRect(); ren.setSize(r.width,r.height,false); cam.aspect=r.width/Math.max(1,r.height); cam.updateProjectionMatrix(); dirty=true;}
addEventListener('resize',resize);

const geoCache={};
async function geom(id){
  if(geoCache[id]) return geoCache[id];
  const c=MS[id]; const r=await fetch('m/'+id+'.bin.gz');
  const ab=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const q=new Uint16Array(ab,0,c.vc*3), pos=new Float32Array(c.vc*3);
  for(let i=0;i<c.vc;i++){pos[i*3]=c.lo[0]+q[i*3]*c.sc[0];pos[i*3+1]=c.lo[1]+q[i*3+1]*c.sc[1];pos[i*3+2]=c.lo[2]+q[i*3+2]*c.sc[2];}
  const off=c.vc*6; const idx=c.i32?new Uint32Array(ab.slice(off)):new Uint16Array(ab.slice(off));
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeVertexNormals(); g.computeBoundingBox(); g.computeBoundingSphere(); g.computeBoundsTree();
  return geoCache[id]=g;
}
const PALETTE=[0xe9dfc8,0xdccfae,0xe8d6b9,0xd9cdb8,0xefe3cc,0xd4c6a6,0xe3d2c0,0xcfc4ad];
const clipPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),1e5);
function boneMat(col){return new THREE.MeshStandardMaterial({color:col,roughness:.72,metalness:0,clippingPlanes:[clipPlane],side:THREE.DoubleSide});}

/* ---------- state ---------- */
const S={item:null,side:'R',sel:null,labels:'on',typeF:'all',tab:'info',quiz:null,preset:null,colorBones:false};
let meshes=[], pins=[], box=new THREE.Box3(), dirty=true, center=new THREE.Vector3(), radius=100, mirror=1;
const raycaster=new THREE.Raycaster(); raycaster.firstHitOnly=false;

function variant(){const it=S.item; return it.var[S.side]||it.var['']||Object.values(it.var)[0];}
function sideOf(it){return it.var.R?(it.var[S.side]?S.side:'R'):'';}

async function loadItem(id,side,keepView){
  const it=byId[id]; if(!it) return;
  S.item=it; if(side) S.side=side; if(it.var.R && !it.var[S.side]) S.side='R';
  S.sel=null; S.preset=null; clipPlane.constant=1e5; hideInfo(); $('#chip').style.display='none';
  $('#load').style.display='block';
  const v=variant();
  const gs=await Promise.all(v.meshes.map(geom));
  root.clear(); meshes=[];
  gs.forEach((g,i)=>{const mid=v.meshes[i]; const col=S.colorBones&&v.meshes.length>1?PALETTE[i%PALETTE.length]:(mid.includes('tooth')?0xf4f1e6:0xe9dfc8);
    const m=new THREE.Mesh(g,boneMat(col)); m.userData.id=mid; root.add(m); meshes.push(m);});
  box.makeEmpty(); gs.forEach(g=>box.union(g.boundingBox)); box.getCenter(center); radius=box.getSize(new THREE.Vector3()).length()/2;
  buildPins();
  $('#load').style.display='none';
  renderList(); renderTop(); renderPanel();
  if(!keepView) setView(defaultView(it));
  else dirty=true;
  if(S.quiz && S.quiz.mode!=='lr') nextQuiz();
  setHash();
}
function defaultView(it){ if(['skull','frontal','maxilla','zygomatic','nasal','mandible','sternum','hyoid','patella','pelvis','spine','vomer','lacrimal','ethmoid','sphenoid'].includes(it.id)) return 'ant';
  if(['occipital'].includes(it.id)) return 'inf'; if(S.item.kind&&['cervical','c7','thoracic','lumbar','atlas','axis'].includes(it.kind)) return 'sup';
  if(['parietal','temporal'].includes(it.id)) return 'lat'; if(it.id.startsWith('rib')) return 'sup'; if(['hand','foot'].includes(it.id)) return it.id==='hand'?'ant':'sup'; return 'ant';}

/* pins */
const pinGeo=new THREE.SphereGeometry(1,14,10);
function buildPins(){
  pinG.clear(); pins=[];
  const v=variant(); const r=Math.max(0.9,radius*0.012);
  v.pts.forEach((p,i)=>{
    const [k,x,y,z,mid,sd,fl]=p; const L=LM[k]; if(!L) return;
    const mat=new THREE.MeshBasicMaterial({color:L.t==='f'?0x38bdf8:0xf87171,depthTest:true});
    const s=new THREE.Mesh(pinGeo,mat); s.position.set(x,y,z); s.scale.setScalar(r); s.userData={k,i};
    pinG.add(s);
    const el=document.createElement('div'); el.className='lb'+(L.t==='f'?' f':''); el.textContent=short(L.n); el.onclick=e=>{e.stopPropagation(); onPinClick(i);};
    pins.push({k,i,pos:new THREE.Vector3(x,y,z),mesh:s,el,mid,sd,fl:fl||'',vis:true,t:L.t});
  });
  const lab=$('#labels'); lab.innerHTML=''; pins.forEach(p=>lab.appendChild(p.el));
  applyFilter(); dirty=true;
}
function applyFilter(){
  pins.forEach(p=>{const show=(S.typeF==='all'||(S.typeF==='f'?p.t==='f':p.t!=='f')); p.mesh.visible=show; p.filtered=!show;});
  dirty=true;
}
function onPinClick(i){
  if(S.quiz&&S.quiz.mode==='find'){quizAnswerFind(i);return;}
  selectKey(pins[i].k,i);
}
function selectKey(k,pi,fly=true){
  S.sel=k; const ps=pins.filter(p=>p.k===k&&p.mesh.visible);
  let p=pi!=null?pins[pi]:(ps.find(q=>!q.occ)||ps[0]||pins.find(q=>q.k===k)); if(!p){showInfo(k);return;} S.selPin=p.i;
  pins.forEach(q=>{q.mesh.material.color.set(q.k===k?0xf5b94a:(q.t==='f'?0x38bdf8:0xf87171)); q.mesh.scale.setScalar(Math.max(0.9,radius*0.012)*(q.k===k?1.7:1)); q.mesh.material.depthTest=q.k!==k; q.mesh.renderOrder=q.k===k?5:0;});
  if(fly) flyTo(p.pos);
  showInfo(k); renderPanelSel(); setHash(); dirty=true;
}
function flyTo(pt){
  let cur=cam.position.clone().sub(ctl.target).normalize();
  // 현재 방향에서 가려지면 바깥쪽(수평) 방향으로 돌린다
  const testPos=pt.clone().addScaledVector(cur,radius*3);
  raycaster.set(testPos,cur.clone().negate()); raycaster.far=radius*3-1;
  const occ=raycaster.intersectObjects(meshes.filter(m=>m.visible),false).some(h=>!clipped(h.point));
  let dir=cur;
  if(occ){ const out=pt.clone().sub(center); if(radius>60) out.z=0; if(out.length()<1e-3) out.copy(cur); out.normalize();
    dir=out; if(Math.abs(dir.z)<0.9) cam.up.set(0,0,1); }
  const dist=radius>80?radius*1.25:Math.min(Math.max(radius*1.1,45),radius*2.4);
  animCam(pt.clone(), pt.clone().addScaledVector(dir,dist*1.9));
}
let anim=null;
function animCam(target,pos,ms=550){ anim={t0:performance.now(),ms,ft:ctl.target.clone(),fp:cam.position.clone(),tt:target,tp:pos}; }
function stepAnim(now){ if(!anim) return; let t=Math.min(1,(now-anim.t0)/anim.ms); t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  ctl.target.lerpVectors(anim.ft,anim.tt,t); cam.position.lerpVectors(anim.fp,anim.tp,t); if(t>=1) anim=null; dirty=true; }

/* views */
function viewDirs(){ const s=(S.item.var.R? (S.side==='L'?-1:1):1); // lateral dir for this side: right bone lateral = -x
  return {ant:[0,-1,0],post:[0,1,0],lat:[-s,0,0],med:[s,0,0],sup:[0,0,1],inf:[0,0,-1]}; }
const VIEWNAMES={ant:'앞',post:'뒤',lat:'가쪽',med:'안쪽',sup:'위',inf:'아래'};
function setView(v){ const d=new THREE.Vector3(...viewDirs()[v]); const up=(v==='sup')?new THREE.Vector3(0,-1,0):(v==='inf'?new THREE.Vector3(0,-1,0):new THREE.Vector3(0,0,1));
  cam.up.copy(up); const dist=radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*1.05;
  ctl.target.copy(center); cam.position.copy(center).addScaledVector(d,dist); cam.lookAt(center); ctl.update(); S.view=v; renderTop(); dirty=true; }
function skullPreset(p){
  S.preset=S.preset===p?null:p;
  const nomand=S.preset==='ext';
  meshes.forEach(m=>{m.visible=!(nomand&&(m.userData.id==='mandible'||m.userData.id.includes('lower')));});
  clipPlane.constant=S.preset==='int'?1535:1e5;
  pins.forEach(p=>{p.hiddenByPreset=false;
    if(S.preset==='int'&&p.fl!=='i') p.hiddenByPreset=true;
    if(nomand&&!(p.fl==='e'||(p.fl!=='i'&&p.pos.z<1500&&p.mid!=='mandible'))) p.hiddenByPreset=true;
    p.mesh.visible=!p.filtered&&!p.hiddenByPreset;});
  if(S.preset==='int'){ cam.up.set(0,-1,0); ctl.target.set(0,-95,1520); cam.position.set(0,-95,1520+420); }
  else if(S.preset==='ext'){ cam.up.set(0,-1,0); ctl.target.set(0,-100,1500); cam.position.set(0,-100,1500-420); }
  else setView('ant');

/* labels / occlusion */
let lastOcc=0, occDirty=true;
function updateLabels(now){
  const r=main.getBoundingClientRect(); const W=r.width,H=r.height;
  const doOcc=occDirty&&now-lastOcc>100; if(doOcc){ lastOcc=now; occDirty=false; } const visMeshes=meshes.filter(m=>m.visible);
  const placed=[]; const showAll=S.labels==='on';
  const camPos=cam.position;
  const order=pins.map((p,i)=>i).sort((a,b)=>(pins[b].k===S.sel)-(pins[a].k===S.sel)||(pins[b].t==='f')-(pins[a].t==='f'));
  for(const i of order){ const p=pins[i];
    if(!p.mesh.visible){p.el.style.display='none';continue;}
    const v=p.pos.clone().project(cam); const x=(v.x+1)/2*W, y=(1-v.y)/2*H;
    if(doOcc){ if(v.z>=1||x<-60||x>W+60||y<-30||y>H+30){p.occ=true;} else {
      const dir=p.pos.clone().sub(camPos); const d=dir.length(); dir.normalize(); raycaster.set(camPos,dir); raycaster.far=d-Math.max(1.5,radius*0.02);
      raycaster.firstHitOnly=S.preset!=='int'; const hits=raycaster.intersectObjects(visMeshes,false); p.occ=hits.some(h=>!clipped(h.point)); } }
    const isSel=p.k===S.sel, isQ=S.quiz&&S.quiz.target===p.k;
    let show=(!p.occ||(isSel&&p.i===S.selPin)) && v.z<1 && x>-50&&x<W+50&&y>-20&&y<H+20;
    if(S.quiz && (S.quiz.mode==='name'||S.quiz.mode==='find'||S.quiz.mode==='lr')) { if(!(isQ&&S.quiz.mode==='name')) show=false; }
    else if(!showAll && !isSel) show=false;
    p.mesh.visible=!p.filtered&&!p.hiddenByPreset;
    if(show && !isSel && !isQ){ const w=p.el.textContent.length*11.5+14; const rr=[x+6,y-10,x+6+w,y+10];
      if(placed.some(q=>!(rr[2]<q[0]||rr[0]>q[2]||rr[3]<q[1]||rr[1]>q[3]))) show=false; else placed.push(rr); }
    else if(show){ const w=p.el.textContent.length*12+14; placed.push([x+6,y-10,x+6+w,y+10]); }
    p.el.style.display=show?'block':'none';
    if(show){ p.el.style.left=x+'px'; p.el.style.top=y+'px'; p.el.classList.toggle('sel',isSel); p.el.classList.toggle('q',!!(isQ&&S.quiz.mode==='name')); if(isQ&&S.quiz.mode==='name') p.el.textContent='?'; else if(p.el.textContent==='?') p.el.textContent=short(LM[p.k].n);}
  }
}
function clipped(pt){ return S.preset==='int' && pt.z>1535; }

/* picking on canvas */
let down=null;
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>5) return;
  const r=cv.getBoundingClientRect(); const m=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  raycaster.setFromCamera(m,cam); raycaster.far=Infinity;
  const ph=raycaster.intersectObjects(pinG.children.filter(p=>p.visible),false)[0];
  const mh=raycaster.intersectObjects(meshes.filter(x=>x.visible),false).filter(h=>!clipped(h.point))[0];
  if(ph && (!mh || ph.distance<mh.distance+2)){ onPinClick(ph.object.userData.i); return; }
  if(mh){ // 가장 가까운 핀(화면상) 또는 뼈 이름
    let best=null,bd=1e9; pins.forEach((p,i)=>{ if(!p.mesh.visible||p.occ) return; const d=p.pos.distanceTo(mh.point); if(d<bd){bd=d;best=i;} });
    if(best!=null && bd<Math.max(4,radius*0.05) && !(S.quiz&&S.quiz.mode!=='find')){ onPinClick(best); return; }
    if(S.quiz&&S.quiz.mode==='find') return;
    const id=mh.object.userData.id; const c=MS[id]; const owner=ITEMS.find(it=>it.id!==S.item.id && Object.values(it.var).some(v=>v.meshes.length===1&&v.meshes[0]===id));
    const chip=$('#chip'); chip.innerHTML=esc(c.ko)+' <span class="muted">'+esc(c.en)+'</span>'+(owner&&meshes.length>1?'<button id="goBone">이 뼈만 보기 →</button>':'');
    chip.style.display='block'; if(owner&&meshes.length>1) $('#goBone').onclick=()=>{const sd=Object.entries(owner.var).find(([s,v])=>v.meshes[0]===id)[0]; loadItem(owner.id,sd||null);};
    flashMesh(mh.object);
  } else { $('#chip').style.display='none'; }
});

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function nextQuiz(){
  const q=S.quiz; if(!q) return; q.done=false; q.fb='';
  if(q.mode==='lr'){
    const it=pick(PAIRED); const sd=Math.random()<.5?'R':'L'; q.answer=sd; q.itemId=it.id;
    await loadItem(it.id,sd,true); S.quiz=q; // loadItem keeps quiz
    const dirs=[[0,-1,0],[0,1,0],[1,0,0],[-1,0,0],[0.6,-0.8,0],[-0.6,-0.8,0],[0.5,0.7,0.5],[0,0,1]];
    const d=new THREE.Vector3(...pick(dirs)).normalize(); cam.up.set(0,0,1);
    const dist=radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*1.05; ctl.target.copy(center); cam.position.copy(center).addScaledVector(d,dist); ctl.update();
    renderTop(); drawQ(); dirty=true; return;
  }
  let ks=uniqKeys().filter(k=>pins.some(p=>p.k===k&&!p.filtered&&!p.hiddenByPreset));
  if(q.mode==='pass') ks=ks.filter(k=>LM[k].t==='f'&&LM[k].pas);
  if(ks.length<2){ q.target=null; drawQ(); return; }
  let t=pick(ks); if(ks.length>1) while(t===q.target) t=pick(ks);
  q.target=t; S.sel=null;
  pins.forEach(p=>{p.mesh.material.color.set(p.k===t&&q.mode==='name'?0xa78bfa:(p.t==='f'?0x38bdf8:0xf87171)); p.mesh.scale.setScalar(Math.max(0.9,radius*0.012)*(p.k===t&&q.mode==='name'?1.8:1));});

  const pool=(q.mode==='pass'?ks:uniqKeys()).filter(k=>k!==t); const same=pool.filter(k=>LM[k].t===LM[t].t);
  q.opts=shuffle([t,...shuffle(same.length>=3?same:pool).slice(0,3)]);
  if(q.mode==='name'){ const p=pins.find(p=>p.k===t); flyTo(p.pos); }
  hideInfo(); drawQ(); dirty=true;
}

  if(q.mode==='name'){ el.innerHTML=`<div class="qq">보라색 핀(?)의 이름은?</div>`+q.opts.map(k=>`<button class="qbtn" data-k="${k}">${esc(short(LM[k].n))} <span class="muted">${esc(LM[k].o)}</span></button>`).join('')+`<div class="fb ${q.fbc||''}">${q.fb||''}</div>${q.done?'<button class="big" id="qn">다음 문제</button>':''}`; }
  else if(q.mode==='pass'){ el.innerHTML=`<div class="qq">다음 구조물이 지나가는 구멍은?</div><div class="card" style="margin:6px 0">${esc(L.pas)}</div>`+q.opts.map(k=>`<button class="qbtn" data-k="${k}">${esc(short(LM[k].n))} <span class="muted">${esc(LM[k].o)}</span></button>`).join('')+`<div class="fb ${q.fbc||''}">${q.fb||''}</div>${q.done?'<button class="big" id="qn">다음 문제</button>':''}`; }
  else if(q.mode==='find'){ el.innerHTML=`<div class="qq">3D에서 이 위치를 찾아 누르세요</div><div style="font-size:16px;margin:6px 0">${esc(L.n)}</div><div class="muted">${esc(L.o)} · ${esc(L.e)}</div><div class="fb ${q.fbc||''}">${q.fb||''}</div>${q.done?'<button class="big" id="qn">다음 문제</button>':'<button class="ghost" id="qskip" style="margin-top:8px">모르겠음 (정답 보기)</button>'}`;
    const sk=$('#qskip'); if(sk) sk.onclick=()=>{ q.n++; q.done=true; q.fbc='no'; q.fb='정답 위치를 표시했습니다.'; selectKey(q.target); drawQ(); }; }
  el.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{ if(q.done) return; q.n++; const ok=b.dataset.k===q.target; if(ok) q.ok++; q.done=true;
    el.querySelectorAll('.qbtn').forEach(x=>{ if(x.dataset.k===q.target) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    q.fbc=ok?'ok':'no'; q.fb=ok?'정답!':'오답'; if(q.mode!=='find'){ selectKey(q.target,null,q.mode==='pass'); }
    renderQuiz(); });
  const n=$('#qn'); if(n) n.onclick=()=>{ nextQuiz(); renderQuiz(); };
}
function quizAnswerFind(i){
  const q=S.quiz; if(q.done) return; q.n++; const ok=pins[i].k===q.target; if(ok) q.ok++; q.done=true;
  q.fbc=ok?'ok':'no'; q.fb=ok?'정답!':`오답 — 누른 곳은 "${esc(short(LM[pins[i].k].n))}". 정답 위치를 표시했습니다.`;
  selectKey(q.target); renderQuiz();
}

/* ---------- hash ---------- */
function setHash(){ if(!S.item) return; const h='#'+S.item.id+(S.item.var.R?'/'+S.side:'')+(S.sel?'/'+S.sel:''); if(location.hash!==h) history.replaceState(null,'',h); }
async function fromHash(){ const [id,a,b]=decodeURIComponent(location.hash.slice(1)).split('/'); if(byId[id]){ const side=(a==='R'||a==='L')?a:null; const k=side?b:a; await loadItem(id,side); if(k&&LM[k]) selectKey(k); return true;} return false; }

/* ---------- loop ---------- */
ctl.addEventListener('change',()=>{dirty=true;});
function loop(now){ requestAnimationFrame(loop); stepAnim(now); ctl.update();
  key.position.copy(cam.position).add(cam.up.clone().multiplyScalar(radius*2)); key.target.position.copy(ctl.target);
  fill.position.copy(ctl.target).sub(cam.position.clone().sub(ctl.target)).add(new THREE.Vector3(0,0,-radius));
  if(dirty||anim){ ren.render(scene,cam); occDirty=true; updateLabels(now); dirty=false; idlePending=true; }
  else if(idlePending && now-lastOcc>150){ occDirty=true; updateLabels(now); idlePending=occDirty; } }
let idlePending=false;
resize();
if(!(await fromHash())) await loadItem('skull');
requestAnimationFrame(loop);
window.addEventListener('hashchange',()=>fromHash());
</script>
