<!-- 자동 업데이트: 배포 시각(Last-Modified)이 바뀌면 새 버전으로 갱신 -->
<style>#updBar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;background:#0f1a2e;border:1px solid rgba(94,234,255,.45);color:#e2e8f0;border-radius:22px;padding:7px 8px 7px 16px;font:13px/1.3 system-ui,-apple-system,sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}#updBar button{background:#5eeaff;color:#04121a;border:0;border-radius:16px;padding:6px 12px;font-weight:700;font-size:12.5px}#updBar .x{background:none;color:#94a3b8;padding:4px 6px}</style>
<script>
(function(){
  var here=Date.parse(document.lastModified)||0;
  window.__DEPLOY=here||Date.now();
  window.__vurl=function(u){ return u+(u.indexOf('?')<0?'?':'&')+'d='+window.__DEPLOY; };
  var busy=false, hiddenAt=0, shown=false;
  function go(lm){
    try{ var k='updTry'+lm; if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
    var u=new URL(location.href); u.searchParams.set('v',lm); location.replace(u.toString());
  }
  function bar(lm){
    if(shown) return; shown=true;
    var b=document.createElement('div'); b.id='updBar';
    b.innerHTML='새 버전이 있어요<button>업데이트</button><button class="x" aria-label="닫기">✕</button>';
    b.children[0].onclick=function(){ go(lm); };
    b.children[1].onclick=function(){ b.remove(); };
    document.body.appendChild(b);
  }
  function check(auto){
    if(busy||!here) return; busy=true;
    fetch(location.pathname,{cache:'no-store'}).then(function(r){
      var lm=Date.parse(r.headers.get('last-modified')||'');
      if(lm&&lm>here+1000){ if(auto) go(lm); else bar(lm); }
    }).catch(function(){}).then(function(){ busy=false; });
  }
  check(true);                                   // 앱을 열 때: 새 버전이면 바로 갱신
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ hiddenAt=Date.now(); return; }
    check(hiddenAt && Date.now()-hiddenAt>10*60*1000); // 오래 쉬었다 돌아오면 자동, 아니면 안내
  });
  setInterval(function(){ if(!document.hidden) check(false); },30*60*1000);
})();
</script>
