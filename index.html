<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인체 해부학 3D 아틀라스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--panel:rgba(14,20,36,.86);--line:rgba(148,163,184,.16);--text:#e6eaf2;--muted:#8d99ae;--acc:#22d3ee;--acc2:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;height:100vh}
#side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#side header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
#side h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
#side h1 span{color:var(--acc)}
#side .tag{font-size:11.5px;color:var(--muted);margin-top:4px}
#search{margin-top:12px;width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-size:13.5px;outline:none}
#search:focus{border-color:var(--acc)}
.controls{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px;font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
input[type=range]{width:130px;accent-color:var(--acc)}
.sw{position:relative;width:34px;height:19px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:20px;background:#2a3348;transition:.2s}
.sw span:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:#cbd5e1;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(15px);background:#fff}
#list{flex:1;overflow:auto;padding:6px 8px 20px}
details.sys{border-radius:10px;margin:4px 0}
details.sys>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
details.sys>summary::-webkit-details-marker{display:none}
details.sys>summary:hover{background:rgba(255,255,255,.04)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.cnt{color:var(--muted);font-size:11.5px;margin-left:auto;margin-right:4px}
.chev{color:var(--muted);font-size:11px;transition:.2s}
details[open]>summary .chev{transform:rotate(90deg)}
details.sub{margin:2px 0 2px 14px}
details.sub>summary{list-style:none;font-size:12.5px;color:var(--muted);padding:5px 10px;cursor:pointer}
details.sub>summary::-webkit-details-marker{display:none}
.item{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px 6px 30px;border-radius:7px;font-size:13px;color:#cbd5e1}
.item small{color:var(--muted);margin-left:6px;font-size:11px}
.item:hover{background:rgba(34,211,238,.08);color:#fff}
.item.on{background:rgba(34,211,238,.16);color:#fff}
#side footer{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.5}
#stage{flex:1;position:relative;background:radial-gradient(ellipse at 50% 35%,#16223d 0%,#0a1020 55%,#05080f 100%)}
#c{width:100%;height:100%;display:block;touch-action:none}
.bar{position:absolute;top:14px;display:flex;gap:6px;z-index:4}
#modeBar{left:14px}
#viewBar{right:14px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;backdrop-filter:blur(8px)}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:rgba(34,211,238,.18);color:#fff}
.seg button:hover{color:#fff}
#menuBtn{display:none}
#tip{position:absolute;pointer-events:none;background:rgba(5,8,15,.92);border:1px solid var(--line);padding:5px 9px;border-radius:7px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:6}
#tip small{color:var(--muted);margin-left:5px}
#hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--muted);pointer-events:none}
#isoChip{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);border-radius:20px;padding:5px 6px 5px 14px;font-size:12.5px;display:none;align-items:center;gap:8px;z-index:4}
#isoChip button{background:var(--acc);border:0;color:#04121a;border-radius:14px;padding:3px 10px;font-weight:700;font-size:12px}
.panel{position:absolute;right:14px;top:62px;width:340px;max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;backdrop-filter:blur(10px);z-index:4;transition:opacity .2s,transform .2s}
.panel.hidden{opacity:0;transform:translateY(8px);pointer-events:none}
.systag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.panel h2{margin:10px 0 2px;font-size:22px;letter-spacing:-.02em}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.panel p{font-size:13.5px;line-height:1.7;margin:0 0 12px;color:#d6dbe6}
.panel h4{margin:14px 0 6px;font-size:12px;color:var(--acc);letter-spacing:.04em}
.panel ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#d6dbe6}
.clin{background:rgba(251,191,36,.07);border-left:3px solid var(--acc2);padding:9px 11px;border-radius:0 8px 8px 0;font-size:13px!important}
.actions{display:flex;gap:6px;margin-top:14px}
.btn{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.pri{background:var(--acc);color:#04121a;border-color:var(--acc);font-weight:700}
.close{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:18px}
#quiz .score{float:right;margin-right:26px;font-size:13px;color:var(--muted)}
#quiz .score b{color:var(--acc2);font-size:16px}
#qprompt{font-size:15px;line-height:1.6;margin:14px 0}
#qprompt b{color:var(--acc2);font-size:19px}
#qopts{display:grid;gap:7px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:#34d399;background:rgba(52,211,153,.14)}
.opt.no{border-color:#f87171;background:rgba(248,113,113,.14)}
#qfb{font-size:13.5px;line-height:1.6;margin-top:12px;min-height:20px}
#qfb .good{color:#34d399;font-weight:700}#qfb .bad{color:#f87171;font-weight:700}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;z-index:3}
@media (max-width:820px){
  #side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s;width:86vw;max-width:320px}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #menuBtn{display:block}
  .panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:48vh}
  #viewBar{top:58px;right:10px}
  #hint{display:none}
  .seg button{padding:6px 9px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>인체 해부학 <span>3D</span> 아틀라스</h1>
      <div class="tag">전신 개요 · 구조물을 클릭하면 설명이 나옵니다</div>
      <input id="search" type="search" placeholder="검색: 넙다리뼈, 대퇴골, femur…" autocomplete="off">
    </header>
    <div class="controls">
      <div class="row">피부 윤곽 <input id="skinOp" type="range" min="0" max="0.5" step="0.01" value="0.10"></div>
      <div class="row">뼈 반투명 (X-ray) <label class="sw"><input id="xray" type="checkbox"><span></span></label></div>
      <div class="row">자동 회전 <label class="sw"><input id="spin" type="checkbox"><span></span></label></div>
    </div>
    <div id="list"></div>
    <footer>교육용 단순화 모델입니다. 형태와 비율은 근사치이며, 정확한 형태는 아틀라스로 확인하세요.</footer>
  </aside>
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="loading">3D 모델 불러오는 중…</div>
    <div class="bar" id="modeBar">
      <div class="seg" id="menuBtn"><button id="menuToggle">☰ 목록</button></div>
      <div class="seg"><button data-mode="explore" class="on">탐색</button><button data-mode="quiz">퀴즈</button></div>
    </div>
    <div class="bar" id="viewBar">
      <div class="seg">
        <button data-view="front">앞</button><button data-view="back">뒤</button><button data-view="right">오른쪽</button><button data-view="left">왼쪽</button><button data-view="reset" title="처음 시점">↺</button>
      </div>
    </div>
    <div id="isoChip"><span id="isoName"></span><button id="isoOff">전체 보기</button></div>
    <div id="tip"></div>
    <div id="hint">드래그: 회전 · 휠/핀치: 확대 · 우클릭(두 손가락) 드래그: 이동 · Esc: 선택 해제</div>
    <section id="info" class="panel hidden"></section>
    <section id="quiz" class="panel hidden">
      <button class="close" id="qclose">×</button>
      <span class="systag">퀴즈</span><span class="score">점수 <b id="qscore">0</b> / <span id="qtotal">0</span></span>
      <div class="seg" style="margin-top:12px;width:max-content"><button data-qt="name" class="on">이름 맞히기</button><button data-qt="locate">위치 찾기</button></div>
      <div id="qprompt"></div>
      <div id="qopts"></div>
      <div id="qfb"></div>
      <div class="actions"><button class="btn" id="qskip">건너뛰기</button><button class="btn pri" id="qnext">다음 문제</button></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:10px">문제는 현재 켜져 있는 계통에서만 나옵니다.</div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- 계통 ---------------- */
const SYSTEMS = {
  skeletal:   {ko:'골격계', en:'Skeletal', dot:'#e9dfc9'},
  nervous:    {ko:'신경계', en:'Nervous', dot:'#f2d16b'},
  cardio:     {ko:'순환계 (심혈관·림프)', en:'Circulatory', dot:'#e04848'},
  respiratory:{ko:'호흡계', en:'Respiratory', dot:'#f29bb0'},
  digestive:  {ko:'소화계', en:'Digestive', dot:'#d08a55'},
  urinary:    {ko:'비뇨계', en:'Urinary', dot:'#a777d6'},
  endocrine:  {ko:'내분비계', en:'Endocrine', dot:'#4fc3a1'},
};

/* ---------------- 구조물 정보 ---------------- */
const INFO = {
skull:{sys:'skeletal',ko:'머리뼈',old:'두개골',en:'Skull (Cranium)',
 desc:'뇌를 감싸는 뇌머리뼈(8개)와 얼굴의 틀을 이루는 얼굴뼈(14개)로 이루어진다. 아래턱뼈를 제외한 뼈들은 봉합으로 단단히 맞물려 움직이지 않는다.',
 points:['머리뼈바닥은 앞·중간·뒤 머리뼈우묵으로 나뉨','큰구멍(foramen magnum)을 통해 숨뇌가 척수로 이어짐','눈확·코안·입안의 뼈대를 형성'],
 clinical:'신생아는 봉합 사이에 숫구멍이 있다(앞숫구멍은 대개 18–24개월에 닫힘). 머리뼈바닥 골절 시 너구리눈 징후, Battle 징후, 뇌척수액 코누출이 나타날 수 있다.'},
mandible:{sys:'skeletal',ko:'아래턱뼈',old:'하악골',en:'Mandible',
 desc:'머리뼈 중 유일하게 움직이는 뼈로, 턱관절(TMJ)에서 관자뼈와 관절한다. 몸통과 양쪽 가지(ramus)로 이루어지며 아래 치아가 박혀 있다.',
 points:['턱뼈가지 안쪽의 아래턱뼈구멍으로 아래이틀신경이 들어감','턱끝구멍으로 턱끝신경이 나옴','깨물근·관자근·날개근 등 씹기근육이 붙음'],
 clinical:'턱관절 탈구는 입을 크게 벌릴 때 관절머리가 관절결절 앞으로 빠지는 형태가 흔하다. 아래이틀신경 차단은 아래턱 치과 마취의 기본이다.'},
sacrum:{sys:'skeletal',ko:'엉치뼈',old:'천골',en:'Sacrum',
 desc:'5개의 엉치척추가 합쳐진 역삼각형 뼈. 양옆으로 볼기뼈와 엉치엉덩관절을 이루어 척주의 체중을 골반으로 전달한다.',
 points:['앞·뒤 엉치뼈구멍으로 엉치신경 가지가 나옴','엉치뼈곶(promontory)은 골반 입구의 뒤쪽 경계','엉치뼈틈새(sacral hiatus)는 꼬리 쪽 경막외 마취의 진입로'],
 clinical:'엉치엉덩관절염은 강직척추염의 초기 침범 부위로 중요하다.'},
coccyx:{sys:'skeletal',ko:'꼬리뼈',old:'미골',en:'Coccyx',
 desc:'3–5개의 퇴화된 꼬리척추가 합쳐진 작은 뼈. 골반바닥 근육과 인대가 붙는 자리다.',
 points:['항문올림근·큰볼기근 일부가 부착'],
 clinical:'엉덩방아 뒤 꼬리뼈 통증(coccydynia)이 흔하다.'},
sternum:{sys:'skeletal',ko:'복장뼈',old:'흉골',en:'Sternum',
 desc:'가슴 앞 정중앙의 납작한 뼈. 자루·몸통·칼돌기 세 부분으로 되어 있고, 위로 빗장뼈, 옆으로 1–7번 갈비연골과 관절한다.',
 points:['복장뼈각(Louis angle) = 2번 갈비연골 높이, T4/T5 원판 높이','복장뼈각 높이에서 대동맥활이 시작·끝나고 기관이 갈라짐','목아래패임(jugular notch)은 대략 T2–T3 높이'],
 clinical:'심폐소생술 가슴압박은 복장뼈 아래쪽 절반에. 칼돌기를 누르면 간 손상 위험이 있다. 성인 골수천자 부위로도 쓰인다.'},
costal:{sys:'skeletal',ko:'갈비연골',old:'늑연골',en:'Costal cartilage',
 desc:'갈비뼈 앞끝과 복장뼈를 잇는 유리연골. 8–10번 갈비연골은 바로 위 연골에 차례로 붙어 갈비활(costal margin)을 만든다.',
 points:['흉곽에 탄력을 주어 호흡 운동을 가능하게 함','갈비활은 배 진찰 시 위쪽 경계'],
 clinical:'갈비연골염(Tietze 증후군 등)은 흉통의 감별진단에 포함된다.'},
clavicle:{sys:'skeletal',ko:'빗장뼈',old:'쇄골',en:'Clavicle',
 desc:'S자로 굽은 긴뼈로, 복장뼈와 어깨뼈 봉우리를 잇는 버팀대다. 팔을 몸통뼈대에 연결하는 유일한 뼈 연결이다.',
 points:['안쪽 2/3는 앞으로, 가쪽 1/3은 뒤로 볼록','아래로 빗장밑동맥·정맥과 팔신경얼기가 지나감'],
 clinical:'가장 흔히 골절되는 뼈 중 하나로, 중간 1/3 골절이 대부분이다. 안쪽 조각은 목빗근에 의해 위로, 가쪽 조각은 팔 무게로 아래로 끌린다.'},
scapula:{sys:'skeletal',ko:'어깨뼈',old:'견갑골',en:'Scapula',
 desc:'등 위쪽, 대략 2–7번 갈비뼈 높이에 놓인 삼각형 납작뼈. 접시오목에서 위팔뼈와 어깨관절을 이룬다.',
 points:['어깨뼈가시가 가쪽으로 이어져 봉우리(acromion)가 됨','부리돌기에 작은가슴근·위팔두갈래근 짧은갈래가 붙음','돌림근띠(가시위·가시아래·작은원·어깨밑근)가 시작'],
 clinical:'긴가슴신경 손상 → 앞톱니근 마비 → 날개어깨뼈(winged scapula).'},
humerus:{sys:'skeletal',ko:'위팔뼈',old:'상완골',en:'Humerus',
 desc:'팔에서 가장 긴 뼈. 위끝의 머리가 어깨뼈와, 아래끝이 노뼈·자뼈와 관절한다.',
 points:['외과목(surgical neck): 겨드랑신경, 뒤위팔휘돌이동맥','몸통 뒤 노신경고랑: 노신경, 깊은위팔동맥','안쪽위관절융기 뒤: 자신경'],
 clinical:'몸통 중간 골절 → 노신경 손상 → 손목처짐(wrist drop). 외과목 골절 → 겨드랑신경 손상(어깨세모근 마비). 소아 위관절융기위 골절은 위팔동맥·정중신경 손상 위험이 있다.'},
radius:{sys:'skeletal',ko:'노뼈',old:'요골',en:'Radius',
 desc:'아래팔 가쪽(엄지 쪽)의 뼈. 아래끝이 넓어져 손목관절의 주된 관절면을 이루고, 자뼈 주위를 돌며 엎침·뒤침을 만든다.',
 points:['노뼈머리는 고리인대 안에서 회전','붓돌기는 손목 가쪽에서 만져짐'],
 clinical:'Colles 골절: 손을 짚고 넘어질 때 먼쪽 끝이 뒤쪽으로 밀리는 골절(dinner-fork 변형). 소아에서는 노뼈머리 아탈구(당김팔꿈치)가 흔하다.'},
ulna:{sys:'skeletal',ko:'자뼈',old:'척골',en:'Ulna',
 desc:'아래팔 안쪽(새끼 쪽)의 뼈. 위끝의 팔꿈치머리와 갈고리돌기가 위팔뼈 도르래를 감싸 팔꿉관절을 안정시킨다.',
 points:['팔꿈치머리(olecranon)에 위팔세갈래근 부착','먼쪽 끝은 관절원반(삼각섬유연골)이 있어 손목관절에 직접 참여하지 않음'],
 clinical:'Monteggia 골절: 자뼈 몸쪽 골절 + 노뼈머리 탈구. 팔꿈치머리 골절은 세갈래근에 의해 조각이 벌어지기 쉽다.'},
hand:{sys:'skeletal',ko:'손뼈',old:'수골',en:'Bones of the hand',
 desc:'손목뼈 8개, 손허리뼈 5개, 손가락뼈 14개로 모두 27개다.',
 points:['손목뼈 몸쪽 줄: 손배·반달·세모·콩알뼈','먼쪽 줄: 큰마름·작은마름·알머리·갈고리뼈','엄지는 첫마디·끝마디 두 개뿐'],
 clinical:'손배뼈 골절: 해부학적 코담배갑 압통. 혈액이 먼쪽에서 들어오므로 몸쪽 조각에 무혈성 괴사 위험이 있다. 반달뼈 탈구는 손목굴 증후군을 일으킬 수 있다.'},
hipbone:{sys:'skeletal',ko:'볼기뼈',old:'관골',en:'Hip bone (Os coxae)',
 desc:'엉덩뼈·궁둥뼈·두덩뼈 세 뼈가 사춘기 이후 절구(acetabulum)에서 하나로 합쳐진 뼈. 양쪽 볼기뼈와 엉치뼈가 골반을 이룬다.',
 points:['엉덩뼈능선 최고점 ≈ L4 높이','위앞엉덩뼈가시(ASIS): 샅고랑인대·넙다리빗근 부착, 계측 기준점','궁둥뼈결절: 앉을 때 체중을 받음','폐쇄구멍으로 폐쇄신경·혈관이 지나감'],
 clinical:'뒤엉덩뼈능선은 골수 흡인·생검의 표준 부위다. 남녀 골반은 입구 모양과 두덩밑각에서 차이가 뚜렷하다.'},
femur:{sys:'skeletal',ko:'넙다리뼈',old:'대퇴골',en:'Femur',
 desc:'인체에서 가장 길고 강한 뼈. 머리가 절구와 엉덩관절을, 아래끝의 두 관절융기가 정강뼈와 무릎관절을 이룬다.',
 points:['목-몸통각 약 125°, 앞기울기 약 10–15°','큰돌기에 중간·작은볼기근, 작은돌기에 엉덩허리근','거친선(linea aspera)에 넓적다리 근육 다수 부착'],
 clinical:'노인 넙다리뼈목 골절: 다리가 짧아지고 바깥돌림된다. 안쪽넙다리휘돌이동맥 손상 시 넙다리뼈머리 무혈성 괴사 위험.'},
patella:{sys:'skeletal',ko:'무릎뼈',old:'슬개골',en:'Patella',
 desc:'넙다리네갈래근 힘줄 안에 생긴 인체에서 가장 큰 종자뼈. 무릎을 펼 때 지렛대 역할을 한다.',
 points:['아래로 무릎인대가 정강뼈거친면에 붙음','넙다리뼈 도르래 고랑을 미끄러지며 움직임'],
 clinical:'무릎뼈는 대개 가쪽으로 탈구된다. 무릎반사(무릎인대 두드림)로 L3–L4를 검사한다.'},
tibia:{sys:'skeletal',ko:'정강뼈',old:'경골',en:'Tibia',
 desc:'종아리 안쪽의 굵은 뼈로 다리 체중을 대부분 받는다. 위끝은 넙다리뼈와, 아래끝은 목말뼈와 관절한다.',
 points:['앞모서리(정강이)는 피부 바로 밑에서 만져짐','안쪽복사(medial malleolus)를 형성','정강뼈거친면에 무릎인대 부착'],
 clinical:'피하에 가까워 개방골절이 흔하고, 중간·아래 1/3 경계는 혈액 공급이 적어 유합이 늦어지기 쉽다. 종아리 구획증후군에 주의.'},
fibula:{sys:'skeletal',ko:'종아리뼈',old:'비골',en:'Fibula',
 desc:'종아리 가쪽의 가는 뼈. 체중은 거의 받지 않고 근육 부착과 발목관절 가쪽 안정에 기여한다.',
 points:['가쪽복사는 안쪽복사보다 더 아래로 내려옴','종아리뼈목을 온종아리신경이 감아 돎'],
 clinical:'종아리뼈목 골절이나 깁스 압박 → 온종아리신경 손상 → 발처짐(foot drop). 발목 염좌는 주로 가쪽 인대(앞목말종아리인대)에서 생긴다.'},
foot:{sys:'skeletal',ko:'발뼈',old:'족골',en:'Bones of the foot',
 desc:'발목뼈 7개, 발허리뼈 5개, 발가락뼈 14개로 모두 26개다. 세로·가로 아치가 체중을 분산한다.',
 points:['목말뼈: 발목관절을 이루며 근육이 붙지 않음','발꿈치뼈: 가장 큰 발목뼈, 발꿈치힘줄(아킬레스힘줄) 부착'],
 clinical:'높은 곳에서 떨어져 발꿈치뼈가 골절되면 척추 압박골절 동반 여부를 꼭 확인한다. 5번 발허리뼈 바닥 골절도 흔하다.'},

cerebrum:{sys:'nervous',ko:'대뇌',old:'대뇌',en:'Cerebrum',
 desc:'좌우 대뇌반구로 이루어진 뇌의 가장 큰 부분. 겉의 대뇌겉질(회색질)이 이마엽·마루엽·관자엽·뒤통수엽으로 나뉘어 각기 다른 기능을 맡는다.',
 points:['중심고랑 앞: 일차운동겉질 / 뒤: 일차몸감각겉질','우성반구 Broca 영역(이마엽 아래): 운동성 실어증','Wernicke 영역(관자엽 위): 감각성 실어증','뒤통수엽: 일차시각겉질'],
 clinical:'중간대뇌동맥 경색: 반대쪽 얼굴·팔 위주의 마비와 감각저하, 우성반구라면 실어증. 앞대뇌동맥 경색은 반대쪽 다리 위주로 나타난다.'},
cerebellum:{sys:'nervous',ko:'소뇌',old:'소뇌',en:'Cerebellum',
 desc:'뒤통수 아래, 다리뇌·숨뇌 뒤에 있는 구조. 운동 협응, 균형, 자세 유지, 운동 학습을 담당한다.',
 points:['세 쌍의 소뇌다리로 뇌줄기와 연결','벌레(vermis): 몸통 균형 / 반구: 팔다리 협응','증상은 병변과 같은 쪽에 나타남'],
 clinical:'소뇌 손상: 운동실조, 의도떨림, 교대운동장애, 눈떨림, 다리를 벌린 걸음. 만성 알코올은 벌레를 잘 침범해 몸통 실조를 일으킨다.'},
brainstem:{sys:'nervous',ko:'뇌줄기',old:'뇌간',en:'Brainstem',
 desc:'중간뇌·다리뇌·숨뇌로 이루어져 대뇌와 척수를 잇는 통로. 생명 유지 중추와 대부분의 뇌신경핵이 있다.',
 points:['뇌신경 III–XII의 핵이 위치','숨뇌: 호흡·심혈관 조절 중추','그물체: 의식·각성 유지'],
 clinical:'머리속압 상승으로 소뇌편도가 큰구멍으로 탈출하면 숨뇌가 눌려 호흡정지가 올 수 있다. 교차성 증상(같은 쪽 뇌신경 + 반대쪽 몸 마비)은 뇌줄기 병변의 특징이다.'},
spinalcord:{sys:'nervous',ko:'척수',old:'척수',en:'Spinal cord',
 desc:'큰구멍에서 시작해 척주관 안을 내려가 성인에서 대개 L1–L2 높이에서 척수원뿔로 끝난다. 그 아래로는 신경뿌리 다발인 말총이 이어진다.',
 points:['31쌍 척수신경(목 8·가슴 12·허리 5·엉치 5·꼬리 1)','회색질: 앞뿔(운동) · 뒤뿔(감각) · 가쪽뿔(T1–L2 교감)','목·허리팽대에서 팔·다리 신경얼기가 나옴'],
 clinical:'요추천자는 척수 끝 아래인 L3–L4 또는 L4–L5에서 한다. Brown-Séquard 증후군(반쪽 절단): 같은 쪽 운동·고유감각 소실, 반대쪽 통증·온도감각 소실.'},
sciatic:{sys:'nervous',ko:'궁둥신경',old:'좌골신경',en:'Sciatic nerve',
 desc:'인체에서 가장 굵고 긴 말초신경(L4–S3). 큰궁둥구멍으로 골반을 빠져나와 넙다리 뒤쪽을 내려가고, 대개 오금 위에서 정강신경과 온종아리신경으로 나뉜다.',
 points:['보통 궁둥구멍근 아래로 나옴','넙다리 뒤칸 근육(햄스트링)을 지배','무릎 아래 거의 모든 근육을 가지를 통해 지배'],
 clinical:'볼기 근육주사는 위가쪽 1/4에 놓아 궁둥신경 손상을 피한다. 디스크 탈출 등으로 신경뿌리가 눌리면 다리로 뻗치는 좌골신경통이 생긴다.'},

heart:{sys:'cardio',ko:'심장',old:'심장',en:'Heart',
 desc:'가운데세로칸에서 심장막에 싸인 근육성 펌프. 약 2/3가 정중선 왼쪽에 있고, 4개의 방과 4개의 판막으로 혈액을 한 방향으로 보낸다.',
 points:['심장꼭대기: 왼쪽 5번째 갈비사이, 빗장중간선 부근','오른심장동맥은 대개 굴심방결절을 공급','앞심실사이가지(LAD)가 가장 흔한 폐쇄 부위'],
 clinical:'청진 부위: 대동맥판(오른 2번 갈비사이), 폐동맥판(왼 2번), 삼첨판(왼 복장뼈모서리 4–5번), 승모판(심장꼭대기).'},
aorta:{sys:'cardio',ko:'대동맥',old:'대동맥',en:'Aorta',
 desc:'왼심실에서 나오는 가장 큰 동맥. 오름대동맥 → 대동맥활 → 내림대동맥(가슴·배)으로 이어지고, L4 높이에서 좌우 온엉덩동맥으로 갈라진다.',
 points:['대동맥활 가지: 팔머리동맥 → 왼온목동맥 → 왼빗장밑동맥','T12 높이에서 가로막의 대동맥구멍 통과','배대동맥 홑가지: 복강동맥(T12) · 위창자간막동맥(L1) · 아래창자간막동맥(L3)'],
 clinical:'배대동맥류는 콩팥동맥 아래에서 잘 생기며 박동성 배 종괴로 만져진다. 대동맥 박리는 찢어지는 듯한 흉통과 양팔 혈압 차이로 나타난다.'},
carotid:{sys:'cardio',ko:'온목동맥',old:'총경동맥',en:'Common carotid artery',
 desc:'목의 주요 동맥. 오른쪽은 팔머리동맥에서, 왼쪽은 대동맥활에서 직접 나온다. 방패연골 위모서리(C4) 높이에서 속목동맥과 바깥목동맥으로 갈라진다.',
 points:['목동맥집 안에서 속목정맥·미주신경과 함께 주행','갈림 부위의 목동맥팽대(압력수용기)·목동맥토리(화학수용기)'],
 clinical:'목동맥 맥박은 목빗근 앞모서리에서 만져진다. 속목동맥 협착은 일과성 허혈발작·일과성 흑암시의 원인이다. 목동맥팽대 마사지는 미주신경 반사로 맥박을 늦춘다.'},
iliofemoral:{sys:'cardio',ko:'엉덩·넙다리동맥',old:'장골·대퇴동맥',en:'Iliac & femoral arteries',
 desc:'배대동맥이 갈라져 생긴 온엉덩동맥은 속·바깥엉덩동맥으로 나뉜다. 바깥엉덩동맥이 샅고랑인대 아래를 지나며 넙다리동맥이 되고, 모음근굴을 지나 오금동맥으로 이어진다.',
 points:['넙다리삼각 안 배열(가쪽→안쪽): 신경 · 동맥 · 정맥','깊은넙다리동맥이 넙다리 근육 대부분을 공급'],
 clinical:'넙다리동맥은 샅고랑인대 중간 아래에서 만져지며, 심혈관 조영·중재술의 대표 접근 경로다.'},
svc:{sys:'cardio',ko:'위대정맥',old:'상대정맥',en:'Superior vena cava',
 desc:'좌우 팔머리정맥이 합쳐져 생기는 정맥. 머리·목·팔·가슴벽의 정맥혈을 오른심방으로 보낸다.',
 points:['뒤에서 홀정맥이 합류','판막이 없음'],
 clinical:'위대정맥 증후군: 폐암·림프종 등의 압박으로 얼굴·목·팔이 붓고 가슴벽 정맥이 확장된다. 중심정맥관 끝은 위대정맥-오른심방 접합부 부근에 둔다.'},
ivc:{sys:'cardio',ko:'아래대정맥',old:'하대정맥',en:'Inferior vena cava',
 desc:'L5 높이에서 좌우 온엉덩정맥이 합쳐져 시작되고, 대동맥 오른쪽을 따라 올라가 T8 높이에서 가로막의 대정맥구멍을 지나 오른심방으로 들어간다.',
 points:['간 뒤를 지나며 간정맥이 합류','왼콩팥정맥은 대동맥 앞을 건너 합류'],
 clinical:'임신 말기에 바로 누우면 자궁이 아래대정맥을 눌러 저혈압이 올 수 있어 왼쪽으로 눕힌다. 반복되는 폐색전증에서 IVC 필터를 넣기도 한다.'},
spleen:{sys:'cardio',ko:'지라',old:'비장',en:'Spleen',
 desc:'왼쪽 위 배, 9–11번 갈비뼈 높이에 있는 가장 큰 림프기관. 노화 적혈구를 걸러내고 혈액 속 항원에 대한 면역 반응을 담당한다.',
 points:['적색속질: 혈액 여과 / 백색속질: 림프조직','지라동맥은 복강동맥의 가지'],
 clinical:'배 둔상에서 가장 흔히 손상되는 장기. 지라절제 뒤에는 피막세균(폐렴알균 등) 감염 위험이 커서 예방접종이 필요하다.'},

trachea:{sys:'respiratory',ko:'기관',old:'기관',en:'Trachea',
 desc:'후두 아래(C6)에서 시작해 복장뼈각 높이(T4–T5)에서 좌우 주기관지로 갈라지는 관. C자 모양 연골고리가 앞쪽을 받치고, 뒤쪽은 막으로 되어 식도와 닿는다.',
 points:['갈림 부위 안쪽의 용골(carina)은 기침 반사가 매우 예민','오른주기관지가 더 짧고 넓고 수직에 가까움'],
 clinical:'흡인된 이물은 오른주기관지로 잘 들어간다. 응급 기도 확보 시 반지방패막 절개술을 한다.'},
lung_r:{sys:'respiratory',ko:'오른허파',old:'우폐',en:'Right lung',
 desc:'빗틈과 수평틈에 의해 위·중간·아래엽 세 엽으로 나뉜다. 간이 아래에서 가로막을 밀어 올려 왼허파보다 넓고 짧다.',

/* ---------------- 상태 & 표시 ---------------- */
const sysOn={}; for(const s in SYSTEMS) sysOn[s]=true;
let selId=null, hoverId=null, isoId=null, xray=false;
const quiz={on:false,type:'name',target:null,answered:false,score:0,total:0};

function visibleOf(p){ return sysOn[p.sys] && (!isoId || p.id===isoId); }
function updateVisibility(){
  for(const p of Object.values(parts)){ const v=visibleOf(p); p.meshes.forEach(m=>m.visible=v); }
  const chip=document.getElementById('isoChip');
  chip.style.display=isoId?'flex':'none'; if(isoId) document.getElementById('isoName').textContent=`'${parts[isoId].ko}'만 보는 중`;
}
function setOp(m,o){ const t=o<1; if(m.material.transparent!==t) m.material.needsUpdate=true; m.material.transparent=t; m.material.opacity=o; m.material.depthWrite=!t; }
function applyXray(ghostId=null){
  for(const p of Object.values(parts)) p.meshes.forEach(m=>{
    let o=m.userData.baseOpacity; if(xray && m.userData.bone) o=Math.min(o,0.22);
    if(ghostId && p.id!==ghostId) o=Math.min(o,0.1);
    setOp(m,o); });
}
function paint(){
  for(const p of Object.values(parts)){
    let c=0x000000,i=0;
    if(p.id===hoverId){c=0x3b82f6;i=0.35;}
    if(p.id===selId){c=0x22d3ee;i=0.5;}
    p.meshes.forEach(m=>{ m.material.emissive.setHex(c); m.material.emissiveIntensity=i; });
  }
  document.querySelectorAll('.item').forEach(b=>b.classList.toggle('on',b.dataset.id===selId));
}

/* ---------------- 카메라 이동 ---------------- */
let tween=null;
function flyTo(t,p,dur=750){ tween={t0:performance.now(),dur,fT:controls.target.clone(),tT:t.clone(),fP:camera.position.clone(),tP:p.clone()}; }
function focusPart(p){
  const box=new THREE.Box3(); p.meshes.forEach(m=>box.expandByObject(m));
  const c=box.getCenter(V()), sz=box.getSize(V()).length();
  const dir=camera.position.clone().sub(controls.target).normalize();
  flyTo(c,c.clone().add(dir.multiplyScalar(Math.max(3.4,sz*1.5+2))));
}
const VIEWS={front:[0,9.5,30],back:[0,9.5,-30],right:[-30,9.5,0],left:[30,9.5,0]};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  const v=b.dataset.view; if(v==='reset') flyTo(HOME.t,HOME.p); else flyTo(HOME.t,V(...VIEWS[v]));
});

/* ---------------- 정보 패널 ---------------- */
const info=document.getElementById('info');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function select(id,{focus=false}={}){
  selId=id; paint();
  if(!id){ info.classList.add('hidden'); return; }
  const p=parts[id], S=SYSTEMS[p.sys];
  const pair = p.meshes.length>1 && ['clavicle','scapula','humerus','radius','ulna','hand','hipbone','femur','patella','tibia','fibula','foot','lung_r','lung_l','kidney','ureter','adrenal','carotid','iliofemoral','sciatic'].includes(id) || id.startsWith('rib');
  info.innerHTML=`<button class="close" id="infoClose">×</button>
    <span class="systag"><span class="dot" style="color:${S.dot};background:${S.dot}"></span>${S.ko}${p.group?' · '+esc(p.group):''}</span>
    <h2>${esc(p.ko)}</h2>
    <div class="sub">${p.old&&p.old!==p.ko?esc(p.old)+' · ':''}${esc(p.en)}${pair&&!['lung_r','lung_l'].includes(id)?' · 좌우 한 쌍':''}</div>
    <p>${esc(p.desc)}</p>
    ${p.points?.length?`<h4>핵심 포인트</h4><ul>${p.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${p.clinical?`<h4>임상 연관</h4><p class="clin">${esc(p.clinical)}</p>`:''}
    <div class="actions"><button class="btn" id="bFocus">확대해서 보기</button><button class="btn pri" id="bIso">${isoId===id?'전체 보기':'이것만 보기'}</button></div>`;
  info.classList.remove('hidden');
  document.getElementById('infoClose').onclick=()=>select(null);
  document.getElementById('bFocus').onclick=()=>focusPart(p);
  document.getElementById('bIso').onclick=()=>{ isoId = isoId===id?null:id; updateVisibility(); select(id); if(isoId) focusPart(p); };
  if(focus) focusPart(p);
}
document.getElementById('isoOff').onclick=()=>{ isoId=null; updateVisibility(); if(selId) select(selId); };

/* ---------------- 사이드바 목록 ---------------- */
const list=document.getElementById('list');
function buildList(){
  list.innerHTML='';
  for(const s in SYSTEMS){
    const S=SYSTEMS[s], ps=Object.values(parts).filter(p=>p.sys===s);
    const d=document.createElement('details'); d.className='sys'; d.dataset.sys=s;
    d.innerHTML=`<summary><label class="sw" onclick="event.stopPropagation()"><input type="checkbox" ${sysOn[s]?'checked':''}><span></span></label>
      <span class="dot" style="color:${S.dot};background:${S.dot}"></span>${S.ko}<span class="cnt">${ps.length}</span><span class="chev">▶</span></summary>`;
    d.querySelector('input').onchange=e=>{ sysOn[s]=e.target.checked; updateVisibility(); };
    const mk=p=>{ const b=document.createElement('button'); b.className='item'; b.dataset.id=p.id; b.dataset.q=(p.ko+' '+(p.old||'')+' '+p.en).toLowerCase();
      b.innerHTML=`${esc(p.ko)}<small>${esc(p.en.replace(/^.*— /,''))}</small>`; b.onclick=()=>{ if(!sysOn[p.sys]){sysOn[p.sys]=true; d.querySelector('input').checked=true; updateVisibility();} select(p.id,{focus:true}); closeMenu(); }; return b; };
    const groupsMap={};
    ps.forEach(p=>{ if(p.group){ (groupsMap[p.group] ||= []).push(p); } else d.appendChild(mk(p)); });
    for(const g in groupsMap){ const sd=document.createElement('details'); sd.className='sub'; sd.innerHTML=`<summary>▸ ${g}</summary>`; groupsMap[g].forEach(p=>sd.appendChild(mk(p))); d.appendChild(sd); }
    list.appendChild(d);
  }
}
document.getElementById('search').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  list.querySelectorAll('.item').forEach(b=>b.style.display=!q||b.dataset.q.includes(q)?'':'none');
  list.querySelectorAll('details').forEach(d=>{ const any=[...d.querySelectorAll('.item')].some(b=>b.style.display!=='none'); if(q){ d.open=any; d.style.display=any?'':'none'; } else { d.style.display=''; d.open=false; } });
};

/* ---------------- 컨트롤 ---------------- */
document.getElementById('skinOp').oninput=e=>{ const v=+e.target.value; skinMat.opacity=v; skinG.visible=v>0.001; };
document.getElementById('xray').onchange=e=>{ xray=e.target.checked; applyXray(); };
document.getElementById('spin').onchange=e=>{ controls.autoRotate=e.target.checked; };
const side=document.getElementById('side');
document.getElementById('menuToggle').onclick=()=>side.classList.toggle('open');
function closeMenu(){ side.classList.remove('open'); }

/* ---------------- 선택(레이캐스트) ---------------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), tip=document.getElementById('tip');
function pick(ev){
  const r=canvas.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables.filter(m=>m.visible && !(xray && m.userData.bone && !isoId)),false);
  // X-ray 모드에선 뼈 뒤의 장기 우선, 장기가 없으면 뼈
  if(!hits.length && xray){ const h2=ray.intersectObjects(pickables.filter(m=>m.visible),false); return h2[0]?.object.userData.id||null; }
  return hits[0]?.object.userData.id||null;
}
let down=null, moveRaf=0, lastEv=null;
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; controls.autoRotate=false; document.getElementById('spin').checked=false; });
canvas.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>5) return;
  const id=pick(e);
  if(quiz.on && quiz.type==='locate'){ if(id) answerLocate(id); return; }
  if(quiz.on) return;
  select(id);
});
canvas.addEventListener('pointermove',e=>{ lastEv=e; if(moveRaf) return; moveRaf=requestAnimationFrame(()=>{ moveRaf=0;
  if(down || e.pointerType==='touch'){ tip.style.opacity=0; return; }
  const id=pick(lastEv); const hideName = quiz.on;
  if(id!==hoverId){ hoverId=id; paint(); }
  if(id && !hideName){ const p=parts[id]; tip.innerHTML=`${esc(p.ko)}<small>${esc(p.en)}</small>`; tip.style.opacity=1;
    const r=stage.getBoundingClientRect(); tip.style.left=(lastEv.clientX-r.left+14)+'px'; tip.style.top=(lastEv.clientY-r.top+12)+'px'; }
  else tip.style.opacity=0;
  canvas.style.cursor=id?'pointer':'grab'; }); });
canvas.addEventListener('pointerleave',()=>{ tip.style.opacity=0; if(hoverId){hoverId=null;paint();} });
addEventListener('keydown',e=>{ if(e.key==='Escape'){ select(null); } });

/* ---------------- 퀴즈 ---------------- */
const qEl=document.getElementById('quiz'), qprompt=document.getElementById('qprompt'), qopts=document.getElementById('qopts'), qfb=document.getElementById('qfb');
function pool(){ return Object.values(parts).filter(p=>!p.noQuiz && sysOn[p.sys]); }
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function setMode(m){
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  quiz.on = m==='quiz';
  if(quiz.on){ select(null); isoId=null; updateVisibility(); qEl.classList.remove('hidden'); nextQ(); }
  else { qEl.classList.add('hidden'); quiz.target=null; paint(); applyXray(); }
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('qclose').onclick=()=>setMode('explore');
document.querySelectorAll('[data-qt]').forEach(b=>b.onclick=()=>{ quiz.type=b.dataset.qt; document.querySelectorAll('[data-qt]').forEach(x=>x.classList.toggle('on',x===b)); nextQ(); });
document.getElementById('qnext').onclick=()=>nextQ();
document.getElementById('qskip').onclick=()=>{ if(!quiz.answered && quiz.target){ quiz.total++; updScore(); } nextQ(); };
function updScore(){ document.getElementById('qscore').textContent=quiz.score; document.getElementById('qtotal').textContent=quiz.total; }
function nextQ(){
  const P=pool(); qfb.innerHTML=''; quiz.answered=false;
  if(P.length<4){ qprompt.innerHTML='켜진 계통이 너무 적어요. 왼쪽 목록에서 계통을 더 켜주세요.'; qopts.innerHTML=''; return; }
  let t; do{ t=P[Math.floor(Math.random()*P.length)]; }while(P.length>1 && quiz.target && t.id===quiz.target.id);
  quiz.target=t; selId=null; paint(); applyXray(quiz.type==='name'?t.id:null);
  if(quiz.type==='name'){
    qprompt.innerHTML='<b>깜빡이는</b> 구조물의 이름은?';
    const same=shuffle(P.filter(p=>p.id!==t.id && p.sys===t.sys)), others=shuffle(P.filter(p=>p.id!==t.id && p.sys!==t.sys));
    const opts=shuffle([t,...[...same,...others].slice(0,3)]);
    qopts.innerHTML=''; opts.forEach(o=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o.ko+(o.old&&o.old!==o.ko&&!o.ko.includes('(')?` (${o.old})`:'');
      b.onclick=()=>answerName(o,b); qopts.appendChild(b); });
    focusPart(t);
  } else {
    qprompt.innerHTML=`3D 모델에서 <b>${esc(t.ko)}</b>${t.old&&t.old!==t.ko?` <span style="color:var(--muted)">(${esc(t.old)})</span>`:''}을(를) 클릭하세요.`;
    qopts.innerHTML=''; flyTo(HOME.t,HOME.p);
  }
}
function reveal(ok,extra=''){
  quiz.answered=true; quiz.total++; if(ok) quiz.score++; updScore();
  const t=quiz.target; selId=t.id; paint(); applyXray();
  qfb.innerHTML=`${ok?'<span class="good">정답!</span>':'<span class="bad">오답</span>'} ${extra}<br><b>${esc(t.ko)}</b> · ${esc(t.en)}<br><span style="color:var(--muted)">${esc(t.desc)}</span>`;
}
function answerName(o,b){ if(quiz.answered) return; const ok=o.id===quiz.target.id;
  [...qopts.children].forEach(x=>{ x.disabled=true; if(x.textContent.startsWith(quiz.target.ko)) x.classList.add('ok'); }); if(!ok) b.classList.add('no'); reveal(ok); }
function answerLocate(id){ if(quiz.answered) return; const ok=id===quiz.target.id; reveal(ok, ok?'':`클릭한 곳은 '${esc(parts[id].ko)}'예요.`); focusPart(quiz.target); }

/* ---------------- 루프 ---------------- */
function resize(){ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  if(tween){ let k=Math.min(1,(now-tween.t0)/tween.dur); k=1-Math.pow(1-k,3);
    controls.target.lerpVectors(tween.fT,tween.tT,k); camera.position.lerpVectors(tween.fP,tween.tP,k); if(k>=1) tween=null; }
  if(quiz.on && quiz.type==='name' && quiz.target && !quiz.answered){
    const i=0.55+0.3*Math.sin(clock.getElapsedTime()*5);
    quiz.target.meshes.forEach(m=>{ m.material.emissive.setHex(0xfbbf24); m.material.emissiveIntensity=i; });
  }
  controls.update(); renderer.render(scene,camera);
}
buildList(); updateVisibility(); paint(); loop();
document.getElementById('loading').remove();
</script>
